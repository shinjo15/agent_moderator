<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>YouTubeライブチャット取得</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.5; color: #1e293b; overflow-wrap: anywhere; }
  main { box-sizing: border-box; max-width: 1000px; margin: 0 auto; padding: 16px; }
  h1 { margin: 0 0 16px; font-size: 22px; }
  h2 { margin: 16px 0 8px; font-size: 18px; }
  .monitor-controls { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
  .monitor-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  button { padding: 6px 10px; font: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  .monitor-note, .monitor-notice { color: #475569; font-size: 12px; }
  .jev-controls .monitor-note > p:first-child { padding: 12px; border-left: 4px solid #1d4ed8; background: #eff6ff; color: #1e293b; font-size: 14px; font-weight: 600; }
  .monitor-notice { margin-top: 24px; padding-top: 12px; border-top: 1px solid #cbd5e1; }
  .chat-scroll { height: min(52vh, 480px); min-height: 240px; overflow-y: auto; border: 1px solid #cbd5e1; border-radius: 8px; }
  #messages { margin: 0; padding: 0; list-style: none; }
  .chat-message { padding: 8px 12px; border-bottom: 1px solid #e2e8f0; }
  .chat-content { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
  .chat-author { color: #475569; font-size: 12px; font-weight: 600; }
  .author-label { min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
  .author-details { font-size: 11px; font-weight: normal; color: #64748b; }
  .author-details summary { cursor: pointer; }
  .chat-text { min-width: 0; white-space: pre-wrap; }
  .chat-moderation { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; margin-top: 4px; font-size: 12px; color: #475569; }
  .moderation-status.is-malicious { color: #b91c1c; font-weight: 600; }
  .score-badge { border-radius: 4px; padding: 2px 6px; background: #e2e8f0; color: #1e293b; font-variant-numeric: tabular-nums; }
  .score-details summary { cursor: pointer; }
  .score-details dl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; }
  .score-details dd { margin: 0; font-variant-numeric: tabular-nums; }
  .hidden-author-panel { margin-top: 16px; }
  #hidden-authors { padding: 0; list-style: none; }
  #hidden-authors li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #e2e8f0; }
  .hidden-author-label { flex: 1; min-width: 0; }
  .empty-list { padding: 12px; color: #64748b; }
</style>
</head>
<body><main></main><script src="monitor.js" defer></script></body>
</html>
