<!doctype html>
<html lang="ja">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agent Moderator 設定</title>
<style>
  body { box-sizing: border-box; width: 480px; margin: 0; padding: 16px; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
  h1 { margin: 0 0 16px; font-size: 22px; }
  .credential-card { margin: 16px 0; padding: 16px; border: 1px solid #cbd5e1; border-radius: 8px; }
  .credential-title { margin: 0 0 8px; font-size: 18px; }
  .credential-help { margin: 8px 0; color: #475569; font-size: 12px; }
  .credential-label { display: block; margin: 16px 0 6px; font-weight: 600; }
  .credential-input { box-sizing: border-box; width: 100%; max-width: 100%; min-height: 44px; padding: 10px; border: 1px solid #64748b; border-radius: 4px; font: inherit; }
  .credential-input:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
  .credential-status { width: fit-content; padding: 4px 8px; background: #f1f5f9; border-radius: 4px; font-weight: 600; }
  .credential-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .credential-save, .credential-delete { min-height: 40px; padding: 8px 12px; border: 1px solid transparent; border-radius: 4px; color: white; font: inherit; cursor: pointer; }
  .credential-save { background: #1d4ed8; }
  .credential-save:hover { background: #1e40af; }
  .credential-delete, .credential-delete:hover { background: #b91c1c; }
  .credential-save:disabled, .credential-delete:disabled { opacity: 0.6; cursor: not-allowed; }
  .settings-notice { margin-top: 24px; padding-top: 16px; border-top: 1px solid #cbd5e1; color: #475569; font-size: 12px; }
  .filter-details { margin-top: 16px; }
  .filter-details summary { cursor: pointer; font-weight: 600; }
  .sending-disclosure { padding: 12px; border-left: 4px solid #1d4ed8; background: #eff6ff; font-weight: 600; }
</style>
</head>
<body><main></main><script src="options.js" defer></script></body>
</html>
